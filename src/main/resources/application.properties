# Configuração por variáveis de ambiente: NENHUM segredo no repositório.
# DB_PASSWORD é obrigatória (a aplicação não sobe sem ela).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca_digital?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# O esquema é gerenciado pelo Flyway (src/main/resources/db/migration); o Hibernate só valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Erros sem stack trace nem detalhes internos para o cliente.
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful

# Origens autorizadas a chamar a API pelo navegador (separe por vírgula).
app.cors.origens=${CORS_ORIGENS:http://localhost:8081,http://127.0.0.1:5500,http://localhost:5500}

# Só o necessário é exposto pelo Actuator.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
